  // ── Biegebemessung → ω-Verfahren ─────────────────
  'stahlbeton/biegung/omega': () => `
    <div class="card">
      <div class="card-title">ω-Verfahren (dimensionslose Beiwerte)</div>
      <div class="section-note">
        Das gängige Verfahren zur Biegebemessung von Rechteckquerschnitten
        ohne Druckbewehrung. Aus dem bezogenen Moment μ wird der mechanische
        Bewehrungsgrad ω abgelesen.
      </div>
      <div class="formula-box">
        bezogenes Moment:&nbsp; μ<sub>Eds</sub> = M<sub>Eds</sub> / (b·d²·f<sub>cd</sub>)<br><br>
        erforderliche Bewehrung:&nbsp; A<sub>s</sub> = (1/f<sub>yd</sub>)·(ω·b·d·f<sub>cd</sub> + N<sub>Ed</sub>)
        <div class="comment">M<sub>Eds</sub> — auf die Bewehrung bezogenes Moment<br>
        d — statische Nutzhöhe · b — Querschnittsbreite</div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">ω-Tabelle (Auszug)</div>
      <div class="data-table-wrap">
        <table class="data">
          <thead><tr><th>μ_Eds</th><th>ω</th><th>ζ</th><th>ε_c2 ‰</th><th>ε_s1 ‰</th></tr></thead>
          <tbody>
            <tr><td>0,05</td><td>0,0517</td><td>0,981</td><td>-1,5</td><td>25,0</td></tr>
            <tr><td>0,10</td><td>0,1062</td><td>0,960</td><td>-2,4</td><td>25,0</td></tr>
            <tr><td>0,15</td><td>0,1638</td><td>0,938</td><td>-3,5</td><td>22,3</td></tr>
            <tr><td>0,20</td><td>0,2243</td><td>0,915</td><td>-3,5</td><td>15,2</td></tr>
            <tr><td>0,25</td><td>0,2884</td><td>0,891</td><td>-3,5</td><td>10,9</td></tr>
            <tr><td>0,30</td><td>0,3565</td><td>0,864</td><td>-3,5</td><td>8,0</td></tr>
            <tr><td>0,35</td><td>0,4295</td><td>0,835</td><td>-3,5</td><td>5,8</td></tr>
          </tbody>
        </table>
      </div>
      <div class="legend">
        ζ — Hebelarmbeiwert (z = ζ·d) · ε<sub>c2</sub> Betonstauchung ·
        ε<sub>s1</sub> Stahldehnung
      </div>
      <div class="applink" onclick="alert('Interaktive Biegebemessung folgt in statiq·size')">→ Biegebemessung in statiq·size führen</div>
    </div>

    <div class="card">
      <div class="card-title">Durchgerechnetes Beispiel</div>
      <div class="section-note">
        <b>Aufgabe:</b> Ein Stahlbetonbalken b/h = 30/50 cm, statische Nutzhöhe
        d = 45 cm, Beton C25/30, Betonstahl B500. Das Bemessungsmoment beträgt
        M<sub>Ed</sub> = 120 kNm. Gesucht ist die erforderliche
        Biegezugbewehrung A<sub>s</sub>.
      </div>
      <div class="formula-box">
        <b>Schritt 1 — Bemessungsfestigkeiten</b><br>
        f<sub>cd</sub> = α<sub>cc</sub>·f<sub>ck</sub>/γ<sub>C</sub> = 0,85·25/1,5 = 14,17 N/mm²<br>
        f<sub>yd</sub> = f<sub>yk</sub>/γ<sub>S</sub> = 500/1,15 = 434,8 N/mm²
      </div>
      <div class="formula-box">
        <b>Schritt 2 — bezogenes Moment μ<sub>Eds</sub></b><br>
        μ<sub>Eds</sub> = M<sub>Eds</sub> / (b·d²·f<sub>cd</sub>)<br>
        μ<sub>Eds</sub> = 120·10⁶ / (300·450²·14,17) = <b>0,139</b>
      </div>
      <div class="formula-box">
        <b>Schritt 3 — ω aus der Tabelle</b><br>
        Interpolation zwischen μ = 0,10 und μ = 0,15:<br>
        ω ≈ 0,152&nbsp;&nbsp;|&nbsp;&nbsp; ζ ≈ 0,943
      </div>
      <div class="formula-box">
        <b>Schritt 4 — erforderliche Bewehrung</b><br>
        A<sub>s</sub> = (1/f<sub>yd</sub>)·ω·b·d·f<sub>cd</sub><br>
        A<sub>s</sub> = (1/434,8)·0,152·300·450·14,17<br>
        A<sub>s</sub> = 667 mm² = <b>6,67 cm²</b>
      </div>
      <div class="info-banner">
        <b>Ergebnis:</b> Erforderlich sind 6,67 cm² Bewehrung. Praktisch gewählt
        z. B. <b>4 ⌀ 16</b> (8,04 cm²) oder <b>6 ⌀ 12</b> (6,79 cm²) — beide
        liegen über dem erforderlichen Wert. Gegenkontrolle über den Hebelarm
        z = ζ·d = 0,943·450 ≈ 424 mm liefert A<sub>s</sub> = M<sub>Ed</sub>/(z·f<sub>yd</sub>)
        ≈ 651 mm² — dieselbe Größenordnung.
      </div>
      <div class="applink" onclick="navTo('stahlbeton','baustoffe','betonstahl')">→ Bewehrungsquerschnitte A_s nachschlagen</div>
    </div>
  `,

  // ── Querkraft → ohne Bewehrung ───────────────────
  'stahlbeton/querkraft/ohne': () => `
    <div class="card">
      <div class="card-title">Bauteile ohne Querkraftbewehrung — 6.2.2</div>
      <div class="section-note">
        Bei geringer Querkraft (z. B. Platten) kann auf eine Querkraftbewehrung
        verzichtet werden, wenn der Betonquerschnitt allein ausreicht.
      </div>
      <div class="formula-box">
        V<sub>Rd,c</sub> = [C<sub>Rd,c</sub>·k·(100·ρ<sub>l</sub>·f<sub>ck</sub>)<sup>1/3</sup>] · b<sub>w</sub>·d<br><br>
        Nachweis:&nbsp; V<sub>Ed</sub> ≤ V<sub>Rd,c</sub>
        <div class="comment">C<sub>Rd,c</sub> = 0,15/γ<sub>C</sub> · k = 1+√(200/d) ≤ 2,0<br>
        ρ<sub>l</sub> — Längsbewehrungsgrad ≤ 0,02</div>
      </div>
      <div class="info-banner">
        Reicht V<sub>Rd,c</sub> nicht aus, ist eine Querkraftbewehrung
        anzuordnen — dann gilt das Fachwerkmodell.
      </div>
    </div>

    <div class="card">
      <div class="card-title">Mindestwert</div>
      <div class="section-note">
        Unabhängig vom Bewehrungsgrad gilt ein unterer Grenzwert — er sichert
        eine Resttragfähigkeit auch bei sehr geringer Längsbewehrung:
      </div>
      <div class="formula-box">
        v<sub>min</sub> = 0,035 · k<sup>3/2</sup> · √f<sub>ck</sub><br>
        V<sub>Rd,c,min</sub> = v<sub>min</sub> · b<sub>w</sub>·d
      </div>
    </div>

    <div class="card">
      <div class="card-title">Durchgerechnetes Beispiel</div>
      <div class="section-note">
        <b>Aufgabe:</b> Eine Stahlbetonplatte aus C25/30, betrachtet wird ein
        1 m breiter Streifen (b<sub>w</sub> = 1000 mm), statische Nutzhöhe
        d = 160 mm, Längsbewehrung A<sub>sl</sub> = 6,03 cm². Querkraft
        V<sub>Ed</sub> = 60 kN. Reicht der Betonquerschnitt ohne
        Querkraftbewehrung?
      </div>
      <div class="formula-box">
        <b>Schritt 1 — Beiwerte</b><br>
        C<sub>Rd,c</sub> = 0,15/γ<sub>C</sub> = 0,15/1,5 = 0,10<br>
        k = 1 + √(200/d) = 1 + √(200/160) = 2,12 → begrenzt auf <b>2,0</b><br>
        ρ<sub>l</sub> = A<sub>sl</sub>/(b<sub>w</sub>·d) = 603/(1000·160) = 0,0038
      </div>
      <div class="formula-box">
        <b>Schritt 2 — V<sub>Rd,c</sub></b><br>
        V<sub>Rd,c</sub> = 0,10·2,0·(100·0,0038·25)<sup>1/3</sup>·1000·160<br>
        V<sub>Rd,c</sub> = 67,6 kN
      </div>
      <div class="formula-box">
        <b>Schritt 3 — Mindestwert</b><br>
        v<sub>min</sub> = 0,035·2,0<sup>3/2</sup>·√25 = 0,495 N/mm²<br>
        V<sub>Rd,c,min</sub> = 0,495·1000·160 = 79,2 kN
      </div>
      <div class="formula-box">
        <b>Schritt 4 — Nachweis</b><br>
        maßgebend: V<sub>Rd,c</sub> = max(67,6 ; 79,2) = 79,2 kN<br><br>
        V<sub>Ed</sub> / V<sub>Rd,c</sub> = 60 / 79,2 = <b>0,758</b>
      </div>
      <div class="info-banner">
        <b>Ergebnis:</b> Ausnutzung 0,758 ≤ 1,0 — die Platte kommt <b>ohne
        Querkraftbewehrung</b> aus. Beachtenswert: Hier ist der Mindestwert
        V<sub>Rd,c,min</sub> maßgebend, nicht die Grundformel. Bei gering
        bewehrten Platten ist das häufig der Fall.
      </div>
    </div>
  `,

  // ── Bewehrung → Verankerung ──────────────────────
  'stahlbeton/bewehrung/verankerung': () => `
    <div class="card">
      <div class="card-title">Warum muss Bewehrung verankert werden?</div>
      <div class="section-note">
        Ein Bewehrungsstab kann seine Zugkraft nur dann aufnehmen, wenn er fest
        im Beton sitzt. Würde man ihn am Stabende einfach „abschneiden", könnte
        er herausgezogen werden — die Kraft hätte keinen Halt.
      </div>
      <div class="section-note">
        Die Kraftübertragung passiert über <b>Verbund</b>: die Rippen des
        Betonstahls verzahnen sich mit dem Beton. Über eine ausreichend lange
        Strecke — die <b>Verankerungslänge</b> — wird so die volle Stabkraft
        sicher in den Beton eingeleitet.
      </div>
    </div>

    <div class="card">
      <div class="card-title">Verankerungslänge — EN 1992-1-1, 8.4</div>
      <div class="formula-box">
        Grundwert:&nbsp; l<sub>b,rqd</sub> = (⌀/4)·(σ<sub>sd</sub>/f<sub>bd</sub>)<br><br>
        Bemessungswert:&nbsp; l<sub>bd</sub> = α<sub>1</sub>·α<sub>2</sub>·α<sub>3</sub>·α<sub>4</sub>·α<sub>5</sub>·l<sub>b,rqd</sub> ≥ l<sub>b,min</sub>
        <div class="comment">⌀ — Stabdurchmesser · σ<sub>sd</sub> — vorhandene Stahlspannung<br>
        f<sub>bd</sub> — Bemessungsverbundspannung<br>
        α<sub>1</sub>…α<sub>5</sub> — Beiwerte für Stabform, Betondeckung, Querbewehrung</div>
      </div>
      <div class="section-note">
        Anschaulich: Je dicker der Stab (⌀) und je höher seine Spannung
        (σ<sub>sd</sub>), desto mehr Kraft muss übertragen werden — desto länger
        die Verankerung. Ein guter Verbund (großes f<sub>bd</sub>) verkürzt sie.
      </div>
    </div>

    <div class="card">
      <div class="card-title">Verbundbedingungen</div>
      <div class="info-banner">
        <b>Gute</b> Verbundbedingungen: untere Bewehrungslage, oder ≤ 250 mm
        über Bauteilunterkante. <b>Mäßige</b> Verbundbedingungen (obere Lagen
        dicker Bauteile) → f<sub>bd</sub> wird auf 70 % reduziert, die
        Verankerung wird entsprechend länger.<br><br>
        Grund: Beim Betonieren sammelt sich unter hoch liegenden Stäben Wasser
        und Luft — der Verbund ist dort schlechter.
      </div>
    </div>

    <div class="card">
      <div class="card-title">Durchgerechnetes Beispiel</div>
      <div class="section-note">
        <b>Aufgabe:</b> Ein Bewehrungsstab ⌀ 16 mm, voll ausgenutzt
        (σ<sub>sd</sub> = f<sub>yd</sub> = 435 N/mm²), in Beton C25/30, gute
        Verbundbedingungen, gerader Stab. Wie lang muss die Verankerung sein?
      </div>
      <div class="formula-box">
        <b>Schritt 1 — Verbundspannung f<sub>bd</sub></b><br>
        f<sub>ctd</sub> = f<sub>ctk;0,05</sub>/γ<sub>C</sub> = 1,8/1,5 = 1,20 N/mm²<br>
        f<sub>bd</sub> = 2,25·η₁·η₂·f<sub>ctd</sub> = 2,25·1,0·1,0·1,20 = 2,70 N/mm²
        <div class="comment">η₁ = 1,0 (guter Verbund), η₂ = 1,0 (⌀ ≤ 32 mm)</div>
      </div>
      <div class="formula-box">
        <b>Schritt 2 — Grundwert</b><br>
        l<sub>b,rqd</sub> = (⌀/4)·(σ<sub>sd</sub>/f<sub>bd</sub>)<br>
        l<sub>b,rqd</sub> = (16/4)·(435/2,70) = 644 mm
      </div>
      <div class="formula-box">
        <b>Schritt 3 — Bemessungswert</b><br>
        gerader Stab → α<sub>1</sub>…α<sub>5</sub> = 1,0<br>
        l<sub>bd</sub> = 1,0·644 = <b>≈ 64 cm</b>
        <div class="comment">l<sub>b,min</sub> = max(0,3·l<sub>b,rqd</sub>; 10⌀; 100 mm)
        = 193 mm → nicht maßgebend</div>
      </div>
      <div class="info-banner">
        <b>Ergebnis:</b> Der Stab muss rund 64 cm tief verankert werden — das
        ist das 40-fache des Durchmessers. Mit einem Haken oder Winkelhaken
        (α<sub>1</sub> = 0,7) ließe sich die Länge auf etwa 45 cm verkürzen.
      </div>
    </div>
  `,

  // ── Bewehrung → Übergreifung ─────────────────────
  'stahlbeton/bewehrung/uebergreifung': () => `
    <div class="card">
      <div class="card-title">Warum Übergreifungsstöße?</div>
      <div class="section-note">
        Betonstahl wird in begrenzten Längen geliefert (Stäbe meist bis 12–14 m,
        oft kürzer). Für längere Bauteile müssen Stäbe <b>gestoßen</b> werden.
        Der einfachste Stoß ist der Übergreifungsstoß: zwei Stäbe laufen ein
        Stück parallel nebeneinander.
      </div>
      <div class="section-note">
        Die Kraft springt nicht direkt von Stab zu Stab — sie wird über
        <b>Betondruckstreben</b> zwischen den beiden Stäben übertragen. Der eine
        Stab gibt die Kraft an den Beton ab, der Beton an den anderen Stab.
        Deshalb muss die Übergreifungslänge l<sub>0</sub> ausreichend groß sein.
      </div>
    </div>

    <div class="card">
      <div class="card-title">Übergreifungslänge — EN 1992-1-1, 8.7</div>
      <div class="formula-box">
        l<sub>0</sub> = α<sub>1</sub>·α<sub>2</sub>·α<sub>3</sub>·α<sub>5</sub>·α<sub>6</sub>·l<sub>b,rqd</sub> ≥ l<sub>0,min</sub>
        <div class="comment">α<sub>6</sub> — Beiwert für den Anteil gestoßener Stäbe
        im Querschnitt (1,0 bis 1,5)</div>
      </div>
      <div class="section-note">
        Die Übergreifungslänge baut auf demselben Grundwert l<sub>b,rqd</sub>
        auf wie die Verankerung — sie ist meist etwas länger, weil zusätzlich
        der Beiwert α<sub>6</sub> hinzukommt. Werden viele Stäbe an derselben
        Stelle gestoßen, steigt α<sub>6</sub> und damit l<sub>0</sub>.
      </div>
    </div>

    <div class="card">
      <div class="card-title">Konstruktive Regeln</div>
      <div class="section-note">
        Stöße sollten möglichst <b>versetzt</b> angeordnet werden — nicht alle
        Stäbe an derselben Stelle. Im Bereich des Stoßes ist eine Querbewehrung
        anzuordnen, die die Spaltzugkräfte aufnimmt (der Beton zwischen den
        Stäben wird auseinandergedrückt).
      </div>
      <div class="info-banner">
        Stöße werden bevorzugt in Bereiche <b>geringer Beanspruchung</b> gelegt
        — z. B. bei Durchlaufträgern nicht über den Stützen, wo das Moment am
        größten ist, sondern im Feldbereich.
      </div>
      <div class="applink" onclick="navTo('stahlbeton','bewehrung','verankerung')">→ zurück zur Verankerung</div>
    </div>
  `,

  // ── Grundlagen → Kräfte & Momente ────────────────
  'statik/grundlagen/kraefte': () => `
    <div class="card">
      <div class="card-title">Kraft</div>
      <div class="section-note">
        Eine Kraft ist eine gerichtete Größe (Vektor). Sie ist festgelegt durch
        Betrag, Richtung und Wirkungslinie. Einheit: Newton (N), im Bauwesen
        meist Kilonewton (kN).
      </div>
      <div class="formula-box">
        Zerlegung in Komponenten:<br>
        F<sub>x</sub> = F · cos α&nbsp;&nbsp;|&nbsp;&nbsp; F<sub>z</sub> = F · sin α<br><br>
        Resultierende:&nbsp; F = √(F<sub>x</sub>² + F<sub>z</sub>²)
      </div>
    </div>
    <div class="card">
      <div class="card-title">Moment</div>
      <div class="section-note">
        Das Moment einer Kraft beschreibt ihre Drehwirkung um einen Punkt.
        Es ist das Produkt aus Kraft und senkrechtem Abstand (Hebelarm).
      </div>
      <div class="formula-box">
        M = F · a
        <div class="comment">a — Hebelarm: senkrechter Abstand der Wirkungslinie
        vom Bezugspunkt</div>
      </div>
      <div class="info-banner">
        Vorzeichenkonvention: In Statiq wird ein Moment im Uhrzeigersinn
        positiv gezählt. Die Wahl ist frei — sie muss nur konsequent
        beibehalten werden.
      </div>
    </div>
    <div class="card">
      <div class="card-title">Streckenlast</div>
      <div class="section-note">
        Eine über eine Länge verteilte Last. Für die Gleichgewichtsrechnung wird
        sie durch ihre Resultierende ersetzt:
      </div>
      <div class="formula-box">
        Gleichlast:&nbsp; R = q · ℓ&nbsp;&nbsp;(greift in Feldmitte an)<br>
        Dreieckslast:&nbsp; R = ½ · q · ℓ&nbsp;&nbsp;(greift bei ℓ/3 an)
      </div>
    </div>
  `,

  // ── Grundlagen → Auflagertypen ───────────────────
  'statik/grundlagen/auflager': () => `
    <div class="card">
      <div class="card-title">Auflagertypen</div>
      <div class="section-note">
        Auflager verbinden das Tragwerk mit der Umgebung und übertragen
        Reaktionskräfte. Sie unterscheiden sich darin, wie viele
        Bewegungsrichtungen sie sperren — und damit, wie viele Reaktionen
        sie übertragen.
      </div>
      ${FIGURES.supports()}
    </div>
    <div class="card">
      <div class="card-title">Wertigkeit der Auflager</div>
      <div class="data-table-wrap">
        <table class="data">
          <thead><tr><th>Auflager</th><th>Reaktionen</th><th>Wertigkeit</th></tr></thead>
          <tbody>
            <tr><td>Gleitlager</td><td>V</td><td>1</td></tr>
            <tr><td>Festlager</td><td>V, H</td><td>2</td></tr>
            <tr><td>Einspannung</td><td>V, H, M</td><td>3</td></tr>
            <tr><td>Schiebehülse</td><td>H, M</td><td>2</td></tr>
          </tbody>
        </table>
      </div>
      <div class="legend">
        Die Wertigkeit gibt an, wie viele unbekannte Reaktionsgrößen ein
        Auflager liefert — entscheidend für die statische Bestimmtheit.
      </div>
    </div>
  `,

  // ── Grundlagen → Gleichgewicht ───────────────────
  'statik/grundlagen/gleichgewicht': () => `
    <div class="card">
      <div class="card-title">Gleichgewichtsbedingungen</div>
      <div class="section-note">
        Ein Tragwerk ist im Gleichgewicht, wenn es weder verschoben noch
        verdreht wird. In der Ebene gibt es <b>drei</b> Gleichgewichtsbedingungen:
      </div>
      <div class="formula-box">
        ΣF<sub>x</sub> = 0&nbsp;&nbsp;(Summe aller Horizontalkräfte)<br>
        ΣF<sub>z</sub> = 0&nbsp;&nbsp;(Summe aller Vertikalkräfte)<br>
        ΣM = 0&nbsp;&nbsp;&nbsp;(Summe aller Momente um einen beliebigen Punkt)
      </div>
    </div>
    <div class="card">
      <div class="card-title">Anwendung</div>
      <div class="section-note">
        Mit den drei Gleichungen lassen sich bis zu drei unbekannte
        Auflagerreaktionen bestimmen. Ein geschickt gewählter Momentenbezugspunkt
        vereinfacht die Rechnung enorm:
      </div>
      <div class="info-banner">
        Legt man den Bezugspunkt für ΣM auf ein Auflager, fallen dessen
        Reaktionen aus der Gleichung (Hebelarm = 0) — die Gleichung enthält
        dann nur noch eine Unbekannte.
      </div>
    </div>
    <div class="card">
      <div class="card-title">Räumliche Systeme</div>
      <div class="section-note">
        Im dreidimensionalen Fall gibt es <b>sechs</b> Gleichgewichtsbedingungen:
        drei Kraftsummen (ΣF<sub>x</sub>, ΣF<sub>y</sub>, ΣF<sub>z</sub>) und drei
        Momentensummen (ΣM<sub>x</sub>, ΣM<sub>y</sub>, ΣM<sub>z</sub>). Im
        Bauwesen wird meist ebene Statik betrachtet.
      </div>
      <div class="applink" onclick="alert('statiq·calc öffnen')">→ Systeme rechnen in statiq·calc</div>
    </div>
  `,

            <tr><td>Schluff</td><td>0,002–0,063 mm</td><td>schwach bindig</td></tr>
            <tr><td>Ton</td><td>&lt; 0,002 mm</td><td>bindig</td></tr>
          </tbody>
        </table>
      </div>
      <div class="legend">
        <b>Nichtbindig</b> (Kies, Sand) — Tragfähigkeit aus Reibung.
        <b>Bindig</b> (Schluff, Ton) — zusätzlich Kohäsion, setzungsempfindlich.
      </div>
    </div>
    <div class="card">
      <div class="card-title">Klassifizierung</div>
      <div class="section-note">
        Im Grundbau werden Böden u. a. nach DIN 18196 (bautechnische Zwecke)
        klassifiziert. Wichtige Kenngrößen: Korngrößenverteilung
        (Sieblinie), Konsistenz bindiger Böden, Lagerungsdichte
        nichtbindiger Böden.
      </div>
      <div class="info-banner">
        Die Konsistenz bindiger Böden (breiig – weich – steif – halbfest – fest)
        wird über die Zustandsgrenzen nach Atterberg (Fließ- und Ausrollgrenze)
        bestimmt.
      </div>
    </div>
  `,

  // ── Baugrund → Korngrößenverteilung & Sieblinie ──
  'grundbau/baugrund/sieblinie': () => `
    <div class="card">
      <div class="card-title">Wozu die Korngrößenverteilung?</div>
      <div class="section-note">
        Das mechanische Verhalten eines nichtbindigen Bodens hängt stark davon
        ab, wie die Korngrößen <b>verteilt</b> sind: Besteht er aus lauter
        gleich großen Körnern, oder aus einer Mischung von fein bis grob? Die
        Korngrößenverteilung beantwortet das — und damit Fragen zu
        Verdichtbarkeit, Durchlässigkeit und Tragfähigkeit.
      </div>
    </div>

    <div class="card">
      <div class="card-title">Wie wird sie bestimmt?</div>
      <div class="section-note">
        <b>Siebung</b> — für die groben Anteile (&gt; 0,063 mm): Die Bodenprobe
        wird durch einen Satz übereinander gestapelter Siebe mit abnehmender
        Maschenweite gerüttelt. Auf jedem Sieb bleibt ein Anteil zurück; daraus
        ergibt sich, wie viel Masse jede Korngröße ausmacht.
      </div>
      <div class="section-note">
        <b>Schlämmanalyse (Sedimentation)</b> — für die feinen Anteile
        (&lt; 0,063 mm): Diese Körner sind zu klein zum Sieben. Stattdessen
        nutzt man, dass größere Körner in Wasser schneller absinken als kleinere
        (Gesetz von Stokes). Über die Dichteänderung der Suspension mit der Zeit
        wird der Feinkornanteil bestimmt.
      </div>
    </div>

    <div class="card">
      <div class="card-title">Die Sieblinie (Körnungslinie)</div>
      <div class="section-note">
        Das Ergebnis wird in ein <b>halblogarithmisches Diagramm</b> eingetragen:
        x-Achse der Korndurchmesser (logarithmisch, weil er über mehrere
        Zehnerpotenzen reicht), y-Achse der <b>Massendurchgang</b> in % — also
        wie viel Prozent der Probe feiner als der jeweilige Durchmesser sind.
      </div>
      ${FIGURES.sieveCurve()}
      <div class="section-note">
        Die <b>Form</b> der Linie verrät den Bodentyp: Eine <b>steile</b> Linie
        (blau) bedeutet, dass fast alle Körner ähnlich groß sind —
        <b>enggestuft</b> (gleichförmig), z. B. ein sauberer Sand. Eine
        <b>flache</b> Linie (orange) erstreckt sich über viele Korngrößen —
        <b>weitgestuft</b>, gut verdichtbar, weil kleine Körner die Lücken
        zwischen großen füllen.
      </div>
    </div>

    <div class="card">
      <div class="card-title">Ungleichförmigkeit & Krümmung</div>
      <div class="section-note">
        Aus drei Punkten der Sieblinie — den Korndurchmessern bei 10 %, 30 % und
        60 % Durchgang (d₁₀, d₃₀, d₆₀) — werden zwei Kennzahlen gebildet:
      </div>
      <div class="formula-box">
        Ungleichförmigkeitszahl:&nbsp; C<sub>U</sub> = d<sub>60</sub> / d<sub>10</sub><br><br>
        Krümmungszahl:&nbsp; C<sub>C</sub> = d<sub>30</sub>² / (d<sub>10</sub> · d<sub>60</sub>)
        <div class="comment">d<sub>10</sub> wird auch „wirksamer Korndurchmesser" genannt</div>
      </div>
      <div class="data-table-wrap">
        <table class="data">
          <thead><tr><th>C_U</th><th>Bewertung</th></tr></thead>
          <tbody>
            <tr><td>C_U &lt; 3</td><td>enggestuft (gleichförmig)</td></tr>
            <tr><td>3 ≤ C_U ≤ 15</td><td>mitteldicht gestuft</td></tr>
            <tr><td>C_U &gt; 15</td><td>weitgestuft (ungleichförmig)</td></tr>
          </tbody>
        </table>
      </div>
      <div class="info-banner">
        Ein Boden gilt als <b>gut abgestuft</b> (ideal verdichtbar), wenn
        C<sub>U</sub> &gt; 15 <b>und</b> 1 ≤ C<sub>C</sub> ≤ 3. Solche Böden
        eignen sich gut als tragfähige Schüttung — die breite Kornmischung
        lässt sich dicht packen.
      </div>
    </div>
  `,

      <div class="formula-box">

  // ── Erddruck → Erddruckarten ─────────────────────
  'grundbau/erddruck/arten': () => `
    <div class="card">
      <div class="card-title">Erddruckarten</div>
      <div class="section-note">
        Der Erddruck auf eine Wand hängt davon ab, ob und wie sich die Wand
        bewegt. Drei Grundfälle werden unterschieden:
      </div>
      <div class="data-table-wrap">
        <table class="data">
          <thead><tr><th>Art</th><th>Wandbewegung</th><th>Größe</th></tr></thead>
          <tbody>
            <tr><td>aktiv (E_a)</td><td>von Boden weg</td><td>am kleinsten</td></tr>
            <tr><td>Ruhe (E_0)</td><td>keine</td><td>mittel</td></tr>
            <tr><td>passiv (E_p)</td><td>zum Boden hin</td><td>am größten</td></tr>
          </tbody>
        </table>
      </div>
      <div class="legend">
        Schon kleine Wandbewegungen genügen, damit sich der aktive Erddruck
        einstellt. Der passive Erddruck (Erdwiderstand) erfordert große
        Verschiebungen.
      </div>
    </div>
    <div class="card">
      <div class="card-title">Erddruck-Verteilung</div>
      <div class="section-note">
        Der Erddruck wächst linear mit der Tiefe (wie ein hydrostatischer Druck).
        Die Erddruckordinate in der Tiefe z:
      </div>
      ${FIGURES.earthPressure()}
      <div class="formula-box">
        e<sub>a</sub>(z) = K<sub>a</sub> · γ · z − 2·c·√K<sub>a</sub><br><br>
        Resultierende:&nbsp; E<sub>a</sub> = ½ · K<sub>a</sub> · γ · h²
        <div class="comment">Der Kohäsionsterm 2c√K<sub>a</sub> verringert den
        aktiven Erddruck.</div>
      </div>
    </div>
  `,

  // ── Erddruck → Erddruckbeiwerte ──────────────────
  'grundbau/erddruck/beiwerte': () => `
    <div class="card">
      <div class="card-title">Erddruckbeiwerte</div>
      <div class="section-note">
        Die Erddruckbeiwerte K verknüpfen die vertikale Spannung mit der
        horizontalen. Sie hängen vom Reibungswinkel φ' ab (hier: Coulomb,
        senkrechte Wand, waagerechtes Gelände, ohne Wandreibung).
      </div>
      <div class="formula-box">
        Erdruhedruck:&nbsp; K<sub>0</sub> = 1 − sin φ'<br><br>
        aktiv:&nbsp; K<sub>a</sub> = tan²(45° − φ'/2)<br><br>
        passiv:&nbsp; K<sub>p</sub> = tan²(45° + φ'/2)
      </div>
    </div>
    <div class="card">
      <div class="card-title">Beiwerte für gängige Reibungswinkel</div>
      <div class="data-table-wrap">
        <table class="data">
          <thead><tr><th>φ'</th><th>K_0</th><th>K_a</th><th>K_p</th></tr></thead>
          <tbody>
            <tr><td>20°</td><td>0,658</td><td>0,490</td><td>2,04</td></tr>

            <tr><td>30°</td><td>0,500</td><td>0,333</td><td>3,00</td></tr>

      </div>

        Es gilt stets K<sub>a</sub> &lt; K<sub>0</sub> &lt; K<sub>p</sub>.

  // ── Flachgründungen → Grundbruch ─────────────────
  'grundbau/gruendung/grundbruch': () => `
    <div class="card">
      <div class="card-title">Grundbruch — EN 1997-1</div>
      <div class="section-note">
        Beim Grundbruch versagt der Boden unter dem Fundament: er wird seitlich
        verdrängt, das Fundament sackt ein. Der Nachweis stellt die
        Grundbruchlast der Einwirkung gegenüber.
      </div>
      <div class="formula-box">
        Nachweis (GEO-2):&nbsp; V<sub>d</sub> ≤ R<sub>d</sub><br><br>
        R<sub>d</sub> = R<sub>k</sub> / γ<sub>R,v</sub>
        <div class="comment">V<sub>d</sub> — Bemessungswert der Sohlnormalkraft<br>
        R<sub>k</sub> — char. Grundbruchwiderstand · γ<sub>R,v</sub> = 1,40</div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Grundbruchwiderstand</div>
      <div class="section-note">
        Die charakteristische Grundbruchspannung setzt sich aus drei Anteilen
        zusammen — Bodeneigengewicht, seitliche Auflast und Kohäsion:
      </div>
      <div class="formula-box">
        σ<sub>R,k</sub> = γ₂·b'·N<sub>b</sub> + γ₁·d·N<sub>d</sub> + c·N<sub>c</sub>
        <div class="comment">N<sub>b</sub>, N<sub>d</sub>, N<sub>c</sub> —
        Tragfähigkeitsbeiwerte (Funktion von φ')<br>
        b' — rechnerische Fundamentbreite · d — Einbindetiefe<br>
        γ₁ — Wichte über, γ₂ — unter Gründungssohle</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Tragfähigkeitsbeiwerte — DIN 4017</div>
      <div class="section-note">
        Grundwerte für lotrechte, mittige Last und Streifenfundament. Sie wachsen
        stark mit dem Reibungswinkel φ'.
      </div>
      <div class="data-table-wrap">
        <table class="data">
          <thead><tr><th>φ'</th><th>N_b</th><th>N_d</th><th>N_c</th></tr></thead>
          <tbody>
            <tr><td>20°</td><td>1,97</td><td>6,40</td><td>14,83</td></tr>
            <tr><td>25°</td><td>4,51</td><td>10,66</td><td>20,72</td></tr>
            <tr><td>27,5°</td><td>6,73</td><td>13,94</td><td>24,85</td></tr>
            <tr><td>30°</td><td>10,05</td><td>18,40</td><td>30,14</td></tr>
            <tr><td>32,5°</td><td>15,03</td><td>24,58</td><td>37,02</td></tr>
            <tr><td>35°</td><td>22,61</td><td>33,30</td><td>46,12</td></tr>
            <tr><td>37,5°</td><td>34,38</td><td>45,81</td><td>58,40</td></tr>
            <tr><td>40°</td><td>53,03</td><td>64,20</td><td>75,31</td></tr>
          </tbody>
        </table>
      </div>
      <div class="legend">
        N<sub>d</sub> = e<sup>π·tanφ'</sup>·tan²(45°+φ'/2) ·
        N<sub>c</sub> = (N<sub>d</sub>−1)/tanφ' ·
        N<sub>b</sub> = (N<sub>d</sub>−1)·tanφ'
      </div>
    </div>

    <div class="card">
      <div class="card-title">Formbeiwerte ν</div>
      <div class="section-note">
        Der Grundwiderstand gilt für das Streifenfundament. Für andere
        Grundrisse wird jeder Anteil mit einem Formbeiwert multipliziert
        (a/b = Seitenverhältnis):
      </div>
      <div class="data-table-wrap">
        <table class="data">
          <thead><tr><th>Grundriss</th><th>ν_b</th><th>ν_d</th><th>ν_c</th></tr></thead>
          <tbody>
            <tr><td>Streifen</td><td>1,0</td><td>1,0</td><td>1,0</td></tr>
            <tr><td>Rechteck</td><td>1−0,3·b/a</td><td>1+(b/a)·sinφ'</td><td>(ν_d·N_d−1)/(N_d−1)</td></tr>
            <tr><td>Quadrat / Kreis</td><td>0,7</td><td>1+sinφ'</td><td>(ν_d·N_d−1)/(N_d−1)</td></tr>
          </tbody>
        </table>
      </div>
      <div class="info-banner">
        Weitere Beiwerte berücksichtigen Lastneigung (i), Geländeneigung (λ)
        und Sohlneigung. Bei ausmittiger Last wird mit der reduzierten
        rechnerischen Breite b' = b − 2·e gerechnet.
      </div>
      <div class="applink" onclick="alert('Interaktiver Grundbruchnachweis folgt in statiq·size')">→ Grundbruchnachweis in statiq·size führen</div>
    </div>

    <div class="card">
      <div class="card-title">Durchgerechnetes Beispiel</div>
      <div class="section-note">
        <b>Aufgabe:</b> Ein Streifenfundament, Breite b = 1,5 m, Einbindetiefe
        d = 0,8 m, gründet auf mitteldichtem Sand (φ' = 30°, γ = 18 kN/m³,
        c' = 0). Belastung je Meter Fundamentlänge: ständig G<sub>k</sub> =
        180 kN/m, veränderlich Q<sub>k</sub> = 120 kN/m. Ist der Grundbruch­-
        nachweis erfüllt?
      </div>
      <div class="formula-box">
        <b>Schritt 1 — Grundbruchspannung</b><br>
        Tragfähigkeitsbeiwerte für φ' = 30°: N<sub>b</sub> = 10,05 · N<sub>d</sub> = 18,40<br><br>
        σ<sub>R,k</sub> = γ₂·b·N<sub>b</sub> + γ₁·d·N<sub>d</sub><br>
        σ<sub>R,k</sub> = 18·1,5·10,05 + 18·0,8·18,40 = 536 kN/m²
        <div class="comment">Kohäsionsterm entfällt (c' = 0), Streifenfundament → Formbeiwerte = 1</div>
      </div>
      <div class="formula-box">
        <b>Schritt 2 — Widerstand</b><br>
        R<sub>k</sub> = σ<sub>R,k</sub>·b = 536·1,5 = 804 kN/m<br><br>
        R<sub>d</sub> = R<sub>k</sub>/γ<sub>R,v</sub> = 804/1,40 = 575 kN/m
      </div>
      <div class="formula-box">
        <b>Schritt 3 — Einwirkung</b><br>
        V<sub>d</sub> = γ<sub>G</sub>·G<sub>k</sub> + γ<sub>Q</sub>·Q<sub>k</sub><br>
        V<sub>d</sub> = 1,35·180 + 1,50·120 = 423 kN/m
      </div>
      <div class="formula-box">
        <b>Schritt 4 — Nachweis</b><br>
        V<sub>d</sub> / R<sub>d</sub> = 423 / 575 = <b>0,736</b>
      </div>
      <div class="info-banner">
        <b>Ergebnis:</b> Die Ausnutzung beträgt 0,736 ≤ 1,0 — der Grundbruch­-
        nachweis ist <b>erfüllt</b>. Würde man das Fundament schmaler wählen,
        sänke σ<sub>R,k</sub> (kleinerer N<sub>b</sub>-Term) und die Ausnutzung
        stiege rasch an.
      </div>
    </div>
  `,

  // ── Flachgründungen → Setzungen ──────────────────
  'grundbau/gruendung/setzung': () => `
    <div class="card">
      <div class="card-title">Setzungen</div>
      <div class="section-note">
        Setzungen sind die vertikalen Verformungen des Baugrunds unter Last.
        Maßgebend ist nicht nur der Betrag, sondern vor allem die
        <b>ungleichmäßige</b> Setzung (Setzungsdifferenz), die Zwängungen
        im Bauwerk erzeugt.
      </div>
      <div class="formula-box">
        s = Σ ( σ<sub>i</sub> / E<sub>s,i</sub> ) · Δz<sub>i</sub>
        <div class="comment">σ<sub>i</sub> — Spannungszuwachs in der Schicht i ·
        E<sub>s,i</sub> — Steifemodul · Δz<sub>i</sub> — Schichtdicke</div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Setzung mit Einflussbeiwert</div>
      <div class="section-note">
        Für ein Fundament auf homogenem Boden kann die Setzung geschlossen mit
        einem Einflussbeiwert f berechnet werden:
      </div>
      <div class="formula-box">
        s = f · σ<sub>0</sub> · b / E<sub>s</sub>
        <div class="comment">σ<sub>0</sub> — Sohlspannung (Lastanteil) ·
        b — Fundamentbreite · f — Einflussbeiwert</div>
      </div>
      <div class="data-table-wrap">
        <table class="data">
          <thead><tr><th>Fall</th><th>Einflussbeiwert f</th></tr></thead>
          <tbody>
            <tr><td>starres Fundament</td><td>≈ 0,8</td></tr>
            <tr><td>schlaff, Mitte</td><td>≈ 1,1</td></tr>
            <tr><td>schlaff, Rand</td><td>≈ 0,55</td></tr>
          </tbody>
        </table>
      </div>
      <div class="legend">
        Richtwerte für quadratische Fundamente. Genaue Beiwerte hängen von
        Grundriss und Schichtdicke ab.
      </div>
    </div>
    <div class="card">
      <div class="card-title">Zulässige Setzungen</div>
      <div class="section-note">
        Nicht der Absolutbetrag, sondern die Setzungsdifferenz zwischen zwei
        Punkten ist kritisch. Anhaltswerte für die Winkelverdrehung Δs/L:
      </div>
      <div class="data-table-wrap">
        <table class="data">
          <thead><tr><th>Grenzwert Δs/L</th><th>Wirkung</th></tr></thead>
          <tbody>
            <tr><td>1/500</td><td>Risse in tragenden Wänden möglich</td></tr>

            <tr><td>1/150</td><td>Standsicherheit gefährdet</td></tr>
          </tbody>
        </table>
      </div>
      <div class="applink" onclick="alert('Interaktive Setzungsberechnung folgt in statiq·size')">→ Setzungsberechnung in statiq·size führen</div>
    </div>

  // ── Klima → Schneelast ───────────────────────────
  'lasten/klima/schnee': () => `
    <div class="card">
      <div class="card-title">Wie entsteht die Schneelast?</div>
      <div class="section-note">
        Schnee, der sich auf einem Dach ansammelt, drückt als Flächenlast nach
        unten. Wie viel auf dem Dach liegt, hängt von zwei Dingen ab: wie viel
        Schnee in der Region fällt (Standort) und wie das Dach geformt ist
        (rutscht der Schnee ab oder bleibt er liegen?).
      </div>
      <div class="section-note">
        Deshalb startet man mit der Schneelast <b>am Boden</b> s<sub>k</sub> und
        rechnet sie mit Beiwerten auf das Dach um. Schnee ist eine
        <b>veränderliche Einwirkung</b> — er liegt nur im Winter.
      </div>
      <div class="formula-box">
        s = μ<sub>i</sub> · C<sub>e</sub> · C<sub>t</sub> · s<sub>k</sub>
        <div class="comment">μ<sub>i</sub> — Formbeiwert (Dachneigung)<br>
        C<sub>e</sub> — Umgebungsbeiwert (Wind weht Schnee weg) · meist 1,0<br>
        C<sub>t</sub> — Temperaturbeiwert (Wärmeverlust schmilzt Schnee) · meist 1,0<br>
        s<sub>k</sub> — charakteristische Schneelast am Boden</div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Formbeiwert μ₁ — Satteldach</div>
      <div class="section-note">
        Der Formbeiwert beschreibt, welcher Anteil der Bodenschneelast auf dem
        geneigten Dach liegen bleibt. Je steiler das Dach, desto mehr Schnee
        rutscht ab.
      </div>
      <div class="data-table-wrap">
        <table class="data">
          <thead><tr><th>Dachneigung α</th><th>μ₁</th></tr></thead>
          <tbody>
            <tr><td>0° ≤ α ≤ 30°</td><td>0,8</td></tr>
            <tr><td>30° &lt; α &lt; 60°</td><td>0,8·(60−α)/30</td></tr>
            <tr><td>α ≥ 60°</td><td>0,0</td></tr>
          </tbody>
        </table>
      </div>
      <div class="legend">
        Bei sehr steilen Dächern (≥ 60°) rutscht der Schnee vollständig ab —
        rechnerisch keine Schneelast.
      </div>
    </div>
    <div class="card">
      <div class="card-title">Schneelastzonen</div>
      <div class="info-banner">

    </div>
  `,

  // ── Schnittgrößen → Definitionen ─────────────────
  'statik/schnittgroessen/definition': () => `
    <div class="card">
      <div class="card-title">Was sind Schnittgrößen?</div>
      <div class="section-note">
        Wenn man ein belastetes Tragwerk an einer Stelle gedanklich
        <b>durchschneidet</b>, müssen an der Schnittstelle innere Kräfte wirken
        — sonst würden die beiden Teile auseinanderfallen. Diese inneren Kräfte
        heißen <b>Schnittgrößen</b>. Sie halten das Bauteil zusammen und sind
        die Grundlage jeder Bemessung.
      </div>
      ${FIGURES.schnittgroessen()}
    </div>

    <div class="card">
      <div class="card-title">Die drei Schnittgrößen</div>
      <div class="section-note">
        Im ebenen Fall gibt es an jeder Schnittstelle drei Schnittgrößen:
      </div>
      <div class="formula-box">
        <b>N — Normalkraft</b><br>
        wirkt längs der Stabachse · zieht (+) oder drückt (−)<br><br>
        <b>V — Querkraft</b><br>
        wirkt quer zur Stabachse · „verschiebt" die Schnittufer<br><br>
        <b>M — Biegemoment</b><br>
        dreht den Querschnitt · krümmt den Stab
      </div>
    </div>

    <div class="card">
      <div class="card-title">Vorzeichenkonvention</div>
      <div class="section-note">
        Damit Schnittgrößen eindeutig sind, braucht es feste Vorzeichenregeln:
      </div>
      <div class="info-banner">
        <b>N &gt; 0</b> — Zug (Stab wird länger)<br>
        <b>V &gt; 0</b> — am linken Schnittufer nach unten gerichtet<br>
        <b>M &gt; 0</b> — Zug an der Unterseite (Stab hängt durch / „lacht")<br><br>
        Merkhilfe Moment: Ein positives Moment biegt den Träger so, dass die
        Faser <b>unten</b> gedehnt wird — beim Einfeldträger unter Last der
        Normalfall.
      </div>
    </div>

    <div class="card">
      <div class="card-title">Wofür braucht man sie?</div>
      <div class="section-note">
        Jede Schnittgröße führt zu einem eigenen Nachweis:
        <b>N</b> → Zug-/Druck-/Knicknachweis · <b>V</b> → Schubnachweis ·
        <b>M</b> → Biegenachweis. Der größte Wert entlang des Bauteils ist
        meist bemessungsrelevant.
      </div>
      <div class="applink" onclick="navTo('statik','schnittgroessen','zusammenhang')">→ Zusammenhang q–V–M</div>
    </div>
  `,

  // ── Schnittgrößen → Zusammenhang q–V–M ───────────
  'statik/schnittgroessen/zusammenhang': () => `
    <div class="card">
      <div class="card-title">Der Zusammenhang q – V – M</div>
      <div class="section-note">
        Streckenlast, Querkraft und Biegemoment sind nicht unabhängig — sie
        hängen über die <b>Ableitung</b> zusammen. Das ist eines der
        wichtigsten Werkzeuge der Statik: kennt man eine Größe, kann man die
        anderen daraus gewinnen.
      </div>
      <div class="formula-box">
        dV/dx = −q(x)<br><br>
        dM/dx = V(x)
        <div class="comment">Die Querkraft ist die Ableitung des Moments,
        die Streckenlast (negativ) die Ableitung der Querkraft.</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Was folgt daraus?</div>
      <div class="info-banner">
        <b>1.</b> Wo V = 0 ist, hat M einen <b>Extremwert</b> (Hoch- oder
        Tiefpunkt). → So findet man das maximale Moment!<br><br>
        <b>2.</b> Konstante Streckenlast q → V verläuft <b>linear</b> → M
        verläuft <b>parabelförmig</b>.<br><br>
        <b>3.</b> Ohne Last (q = 0) → V ist <b>konstant</b> → M verläuft
        <b>linear</b>.<br><br>
        <b>4.</b> Eine Einzellast erzeugt einen <b>Sprung</b> in der
        Querkraftlinie, ein Einzelmoment einen Sprung in der Momentenlinie.
      </div>
    </div>

    <div class="card">
      <div class="card-title">Anschaulich</div>
      <div class="section-note">
        Die Fläche unter der Querkraftlinie zwischen zwei Punkten ergibt die
        Momentenänderung zwischen diesen Punkten — eine direkte Folge von
        dM/dx = V. Umgekehrt verrät die Steigung der Momentenlinie an jeder
        Stelle den Wert der Querkraft.
      </div>
      <div class="info-banner">
        Beim Einfeldträger unter Gleichlast: V ist am Auflager am größten und
        in Feldmitte null — genau dort, in Feldmitte, liegt das maximale
        Moment M = q·L²/8.
      </div>
      <div class="applink" onclick="alert('statiq·calc öffnen')">→ Schnittgrößenverläufe in statiq·calc ansehen</div>
    </div>
  `,

  // ── Tragwerke → Einfeldträger ────────────────────
  'statik/tragwerke/einfeld': () => `
    <div class="card">
      <div class="card-title">Einfeldträger — der Grundfall</div>
      <div class="section-note">
        Der Einfeldträger ist ein gerader Balken auf zwei Auflagern (ein Fest-,
        ein Gleitlager). Er ist statisch bestimmt und das mit Abstand
        häufigste System — Decken-, Dachträger, Unterzüge.
      </div>
      ${FIGURES.beamSimple()}
    </div>

    <div class="card">
      <div class="card-title">Gleichlast q</div>
      <div class="formula-box">
        Auflagerkraft:&nbsp; A = B = q·L/2<br>
        max. Querkraft:&nbsp; V<sub>max</sub> = q·L/2&nbsp;(am Auflager)<br>
        max. Moment:&nbsp; M<sub>max</sub> = q·L²/8&nbsp;(in Feldmitte)<br>
        max. Durchbiegung:&nbsp; f = 5·q·L⁴/(384·E·I)
      </div>
    </div>

    <div class="card">
      <div class="card-title">Einzellast F in Feldmitte</div>
      <div class="formula-box">
        Auflagerkraft:&nbsp; A = B = F/2<br>
        max. Querkraft:&nbsp; V<sub>max</sub> = F/2<br>
        max. Moment:&nbsp; M<sub>max</sub> = F·L/4&nbsp;(in Feldmitte)<br>
        max. Durchbiegung:&nbsp; f = F·L³/(48·E·I)
      </div>
      <div class="info-banner">
        Die <b>q·L²/8</b> ist die wohl meistgebrauchte Formel der Statik —
        sie sollte man auswendig kennen. Beim Moment fällt auf: Gleichlast
        ergibt L², Einzellast nur L¹ — verteilte Lasten erzeugen bei gleicher
        Gesamtlast ein kleineres Maximalmoment.
      </div>
    </div>

    <div class="card">
      <div class="card-title">Einzellast F an beliebiger Stelle</div>
      <div class="formula-box">
        Last im Abstand a vom linken, b vom rechten Auflager (a+b = L):<br><br>
        A = F·b/L&nbsp;&nbsp;|&nbsp;&nbsp; B = F·a/L<br>
        M<sub>max</sub> = F·a·b/L&nbsp;(unter der Last)
      </div>
      <div class="applink" onclick="alert('statiq·calc öffnen')">→ eigenes System in statiq·calc rechnen</div>
    </div>
  `,

  // ── Tragwerke → Kragarm ──────────────────────────
  'statik/tragwerke/kragarm': () => `
    <div class="card">
      <div class="card-title">Kragarm — einseitig eingespannt</div>
      <div class="section-note">
        Der Kragarm ist an einem Ende fest eingespannt, das andere Ende ist
        frei. Typische Beispiele: Balkonplatte, Vordach, Konsole. Das größte
        Moment tritt immer an der <b>Einspannung</b> auf.
      </div>
      ${FIGURES.beamCantilever()}
    </div>

    <div class="card">
      <div class="card-title">Gleichlast q</div>
      <div class="formula-box">
        Einspannkraft:&nbsp; A = q·L<br>
        max. Querkraft:&nbsp; V<sub>max</sub> = q·L&nbsp;(an der Einspannung)<br>
        max. Moment:&nbsp; M<sub>max</sub> = q·L²/2&nbsp;(an der Einspannung)<br>
        max. Durchbiegung:&nbsp; f = q·L⁴/(8·E·I)&nbsp;(am freien Ende)
      </div>
    </div>

    <div class="card">
      <div class="card-title">Einzellast F am freien Ende</div>
      <div class="formula-box">
        Einspannkraft:&nbsp; A = F<br>
        max. Querkraft:&nbsp; V<sub>max</sub> = F<br>
        max. Moment:&nbsp; M<sub>max</sub> = F·L&nbsp;(an der Einspannung)<br>
        max. Durchbiegung:&nbsp; f = F·L³/(3·E·I)&nbsp;(am freien Ende)
      </div>
      <div class="info-banner">
        Der Kragarm ist viel „weicher" als der Einfeldträger: Bei gleicher
        Stützweite und Gleichlast ist seine Durchbiegung das <b>48-fache</b>
        (q·L⁴/8 statt 5·q·L⁴/384). Kragarme sind daher oft
        durchbiegungs-, nicht spannungsbestimmt.
      </div>
    </div>
  `,

  // ── Tragwerke → Eingespannte Träger ──────────────
  'statik/tragwerke/eingespannt': () => `
    <div class="card">
      <div class="card-title">Beidseitig eingespannter Träger</div>
      <div class="section-note">
        Ein Träger, der an beiden Enden biegesteif eingespannt ist. Er ist
        statisch unbestimmt — die Einspannungen nehmen Momente auf und
        entlasten dadurch das Feld.
      </div>
    </div>

    <div class="card">
      <div class="card-title">Gleichlast q</div>
      <div class="formula-box">
        Stützmoment:&nbsp; M<sub>St</sub> = q·L²/12&nbsp;(an den Einspannungen)<br>
        Feldmoment:&nbsp; M<sub>F</sub> = q·L²/24&nbsp;(in Feldmitte)<br>
        max. Querkraft:&nbsp; V<sub>max</sub> = q·L/2<br>
        max. Durchbiegung:&nbsp; f = q·L⁴/(384·E·I)
      </div>
      <div class="info-banner">
        Der Vergleich mit dem Einfeldträger zeigt die Wirkung der Einspannung:
        Das maßgebende Moment sinkt von q·L²/8 auf q·L²/12 (Stütze), die
        Durchbiegung sogar auf ein Fünftel (q·L⁴/384 statt 5·q·L⁴/384). Die
        Einspannung „versteift" das System deutlich.
      </div>
    </div>

    <div class="card">
      <div class="card-title">Träger mit einer Einspannung & einem Auflager</div>
      <div class="section-note">
        Der gemischte Fall (links eingespannt, rechts gelenkig gelagert) unter
        Gleichlast:
      </div>
      <div class="formula-box">
        Stützmoment:&nbsp; M<sub>St</sub> = q·L²/8&nbsp;(an der Einspannung)<br>
        max. Feldmoment:&nbsp; M<sub>F</sub> ≈ q·L²/14,2<br>
        max. Durchbiegung:&nbsp; f = q·L⁴/(185·E·I)
      </div>
      <div class="applink" onclick="alert('statiq·calc öffnen')">→ Durchlaufträger in statiq·calc rechnen</div>
    </div>
  `,

  // ── Statische Bestimmtheit → Abzählkriterium ─────
  'statik/bestimmtheit/abzaehl': () => `
    <div class="card">
      <div class="card-title">Was heißt statisch bestimmt?</div>
      <div class="section-note">
        Ein Tragwerk ist <b>statisch bestimmt</b>, wenn sich alle Auflager- und
        Schnittgrößen allein aus den drei Gleichgewichtsbedingungen berechnen
        lassen — ohne dass man die Verformung kennen muss. Das ist der
        einfachste und überschaubarste Fall.
      </div>
      <div class="section-note">
        Hat das System <b>mehr</b> unbekannte Reaktionen als Gleichungen, ist es
        <b>statisch unbestimmt</b> — es trägt Lasten über „mehr Wege" ab, die
        Berechnung braucht zusätzliche Verformungsbedingungen. Hat es
        <b>weniger</b>, ist es <b>kinematisch</b> (verschieblich) — kein
        Tragwerk, sondern ein Mechanismus.
      </div>
    </div>

    <div class="card">
      <div class="card-title">Abzählkriterium (ebenes System)</div>
      <div class="formula-box">
        n = (a + z) − 3·k
        <div class="comment">a — Auflagerreaktionen (Summe der Wertigkeiten)<br>
        z — Zwischenreaktionen (Verbindungen zwischen Teilkörpern)<br>
        k — Anzahl der starren Körper (Scheiben)<br>
        3 — Gleichgewichtsbedingungen je Scheibe in der Ebene</div>
      </div>
      <div class="data-table-wrap">
        <table class="data">
          <thead><tr><th>Ergebnis</th><th>Bedeutung</th></tr></thead>
          <tbody>
            <tr><td>n &lt; 0</td><td>kinematisch (verschieblich)</td></tr>
            <tr><td>n = 0</td><td>statisch bestimmt</td></tr>
            <tr><td>n &gt; 0</td><td>n-fach statisch unbestimmt</td></tr>
          </tbody>
        </table>
      </div>
      <div class="info-banner">
        <b>Wichtig:</b> n = 0 ist <b>notwendig</b>, aber nicht <b>hinreichend</b>.
        Auch bei n = 0 kann ein System verschieblich sein, wenn die Auflager
        ungünstig angeordnet sind (z. B. drei parallele oder drei Lager, deren
        Wirkungslinien sich in einem Punkt schneiden). Die Anordnung muss immer
        zusätzlich geprüft werden.
      </div>
    </div>

    <div class="card">
      <div class="card-title">Wertigkeiten zum Abzählen</div>
      <div class="data-table-wrap">
        <table class="data">
          <thead><tr><th>Element</th><th>Wertigkeit</th></tr></thead>
          <tbody>
            <tr><td>Gleitlager</td><td>1</td></tr>
            <tr><td>Festlager</td><td>2</td></tr>
            <tr><td>Einspannung</td><td>3</td></tr>
            <tr><td>Gelenk (verbindet 2 Scheiben)</td><td>2</td></tr>
            <tr><td>Gelenk (verbindet m Scheiben)</td><td>2·(m−1)</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Beispiel — Einfeldträger</div>
      <div class="section-note">
        Ein Balken (k = 1) auf Festlager (2) und Gleitlager (1), keine
        Zwischengelenke (z = 0):
      </div>
      <div class="formula-box">
        n = (a + z) − 3·k = (3 + 0) − 3·1 = <b>0</b>
        <div class="comment">→ statisch bestimmt (der klassische Grundfall)</div>
      </div>
      <div class="info-banner">
        Gegenprobe Durchlaufträger über 3 Felder (Festlager + 3 Gleitlager,
        eine Scheibe): n = (2+1+1+1) − 3·1 = <b>2</b> → zweifach statisch
        unbestimmt.
      </div>
    </div>
  `,

  // ── Statische Bestimmtheit → Kinematische Systeme ─
  'statik/bestimmtheit/systeme': () => `
    <div class="card">
      <div class="card-title">Kinematische Systeme</div>
      <div class="section-note">
        Ein <b>kinematisches</b> System kann sich bewegen, ohne dass sich seine
        Bauteile verformen — es fehlt eine Halterung. Solche Systeme sind als
        Tragwerk unbrauchbar: schon eine kleine Last führt zu großen
        Bewegungen, bis das System „umfällt" oder sich in eine stabile Lage
        verschiebt.
      </div>
      <div class="info-banner">
        Ein kinematisches System hat einen <b>Freiheitsgrad</b> &gt; 0 — es kann
        sich verschieben oder verdrehen. Beim Abzählkriterium äußert sich das in
        n &lt; 0 (zu wenige Reaktionen).
      </div>
    </div>

    <div class="card">
      <div class="card-title">Die Tücke: verdeckte Verschieblichkeit</div>
      <div class="section-note">
        Gefährlich sind Systeme, die das Abzählkriterium mit n = 0 erfüllen,
        aber trotzdem beweglich sind. Das passiert bei ungünstiger
        Lageranordnung:
      </div>
      <div class="formula-box">
        Verschieblich trotz n = 0, wenn:<br>
        — alle Auflagerkräfte <b>parallel</b> sind<br>
        — sich die Wirkungslinien aller Lager in <b>einem Punkt</b> schneiden
        <div class="comment">Dann ist eine Verschiebung bzw. Verdrehung um diesen
        Punkt möglich, ohne dass die Lager sie behindern.</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Polplan & Anschauung</div>
      <div class="section-note">
        Ob ein System wirklich unbeweglich ist, prüft man anschaulich über die
        <b>Polplan-Methode</b>: Man sucht für jede Scheibe den Momentanpol (den
        Punkt, um den sie sich drehen könnte). Lässt sich ein widerspruchsfreier
        Polplan zeichnen, ist eine Bewegung möglich — das System ist
        verschieblich.
      </div>
      <div class="info-banner">
        Faustregel für den Entwurf: drei Auflagerbindungen, deren Wirkungslinien
        <b>weder alle parallel</b> sind <b>noch</b> sich in einem Punkt
        schneiden, ergeben ein stabiles, statisch bestimmtes System.
      </div>
      <div class="applink" onclick="navTo('statik','bestimmtheit','abzaehl')">→ zum Abzählkriterium</div>
    </div>
  `,

  // ── Verformungen → Biegelinie ────────────────────
  'statik/verformung/biegelinie': () => `
    <div class="card">
      <div class="card-title">Die Biegelinie</div>
      <div class="section-note">
        Die <b>Biegelinie</b> w(x) beschreibt die verformte Achse eines
        Balkens unter Last — also wie stark er sich an jeder Stelle durchbiegt.
        Sie ist die Grundlage für den Gebrauchstauglichkeitsnachweis
        (Durchbiegungsbegrenzung).
      </div>
    </div>

    <div class="card">
      <div class="card-title">Differentialgleichung der Biegelinie</div>
      <div class="formula-box">
        E·I · w''(x) = −M(x)
        <div class="comment">E·I — Biegesteifigkeit · M(x) — Momentenverlauf<br>
        w(x) — Durchbiegung an der Stelle x</div>
      </div>
      <div class="section-note">
        Durch <b>zweifache Integration</b> des Momentenverlaufs erhält man die
        Biegelinie. Die zwei Integrationskonstanten ergeben sich aus den
        <b>Randbedingungen</b> (z. B. w = 0 an den Auflagern).
      </div>
      <div class="formula-box">
        E·I · w'(x) = −∫ M(x) dx + C₁&nbsp;&nbsp;(Neigung)<br>
        E·I · w(x) = −∫∫ M(x) dx + C₁·x + C₂&nbsp;&nbsp;(Durchbiegung)
      </div>
    </div>

    <div class="card">
      <div class="card-title">Zusammenhang der Ableitungen</div>
      <div class="data-table-wrap">
        <table class="data">
          <thead><tr><th>Größe</th><th>Bedeutung</th></tr></thead>
          <tbody>
            <tr><td>w(x)</td><td>Durchbiegung</td></tr>
            <tr><td>w'(x)</td><td>Neigung (Verdrehung φ)</td></tr>
            <tr><td>EI·w''(x)</td><td>−M(x) Biegemoment</td></tr>
            <tr><td>EI·w'''(x)</td><td>−V(x) Querkraft</td></tr>
            <tr><td>EI·w''''(x)</td><td>q(x) Streckenlast</td></tr>
          </tbody>
        </table>
      </div>
      <div class="info-banner">
        Die ganze Kette hängt zusammen: von der Last q über V und M bis zur
        Verformung w — jede Größe ist die Ableitung der nächsten. Wer M kennt,
        kommt durch Integrieren zu w; wer w kennt, durch Ableiten zurück zur
        Last.
      </div>
    </div>

    <div class="card">
      <div class="card-title">Standardwerte der Durchbiegung</div>
      <div class="formula-box">
        Einfeldträger, Gleichlast:&nbsp; f = 5·q·L⁴/(384·E·I)<br>
        Einfeldträger, Einzellast Mitte:&nbsp; f = F·L³/(48·E·I)<br>
        Kragarm, Gleichlast:&nbsp; f = q·L⁴/(8·E·I)<br>
        Kragarm, Einzellast Ende:&nbsp; f = F·L³/(3·E·I)
      </div>
      <div class="applink" onclick="navTo('statik','tragwerke','einfeld')">→ zu den Tragwerks-Standardfällen</div>
    </div>
  `,

  // ── Verformungen → Arbeitssatz (PvK) ─────────────
  'statik/verformung/arbeitssatz': () => `
    <div class="card">
      <div class="card-title">Arbeitssatz / Prinzip der virtuellen Kräfte</div>
      <div class="section-note">
        Der Arbeitssatz (PvK) ist die praktischste Methode, um eine einzelne
        Verformung (Durchbiegung oder Verdrehung) an einer bestimmten Stelle zu
        berechnen — auch bei statisch unbestimmten Systemen. Man muss dafür
        nicht die ganze Biegelinie integrieren.
      </div>
    </div>

    <div class="card">
      <div class="card-title">Grundidee</div>
      <div class="section-note">
        Man legt eine <b>virtuelle Last „1"</b> genau dort an, wo man die
        Verformung wissen will — in Richtung der gesuchten Verformung. Die
        gesuchte Verformung ergibt sich dann aus dem Integral über das Produkt
        der Schnittgrößen aus realer und virtueller Belastung.
      </div>
      <div class="formula-box">
        δ = ∫ (M · M̄ / E·I) dx
        <div class="comment">M — Momentenverlauf aus realer Last<br>
        M̄ — Momentenverlauf aus virtueller Last „1"<br>
        δ — gesuchte Verformung an der Lastangriffsstelle</div>
      </div>
      <div class="section-note">
        Vollständig gehen auch Normalkraft- und Querkraftanteile ein; bei
        Biegeträgern dominiert aber meist der M·M̄-Term — die anderen werden oft
        vernachlässigt.
      </div>
    </div>

    <div class="card">
      <div class="card-title">Koppeltafeln</div>
      <div class="section-note">
        Das Integral ∫ M·M̄ dx muss man nicht jedes Mal ausrechnen. Für die
        Kombination einfacher Momentenformen (Dreieck, Rechteck, Parabel) gibt
        es <b>Koppeltafeln (Integraltafeln)</b>, aus denen man das Ergebnis
        direkt abliest.
      </div>
      <div class="info-banner">
        Beispiel: zwei Dreiecke mit gleicher Spitzenlage, Maximalwerte M<sub>i</sub>
        und M̄<sub>k</sub> über Länge s ergeben ∫M·M̄ dx = (1/3)·s·M<sub>i</sub>·M̄<sub>k</sub>.
        Solche Standardprodukte sind in den Koppeltafeln tabelliert.
      </div>
      <div class="applink" onclick="navTo('statik','verformung','biegelinie')">→ zur Biegelinie</div>
    </div>

    <div class="card">
      <div class="card-title">Durchgerechnetes Beispiel</div>
      <div class="section-note">
        <b>Aufgabe:</b> Ein Kragarm IPE 200 (Stahl, E·I bekannt), Länge
        L = 2,5 m, trägt am freien Ende eine Einzellast F = 10 kN. Gesucht ist
        die Durchbiegung δ am freien Ende — über den Arbeitssatz.
      </div>
      <div class="formula-box">
        <b>Schritt 1 — reales Moment M(x)</b><br>
        x vom freien Ende gemessen:&nbsp; M(x) = −F·x<br>
        Maximum an der Einspannung: M<sub>i</sub> = F·L = 10·2,5 = 25 kNm
      </div>
      <div class="formula-box">
        <b>Schritt 2 — virtuelle Last „1" am Ende</b><br>
        Eine Einheitslast 1 wird am freien Ende angesetzt (dort, wo δ gesucht ist):<br>
        M̄(x) = −1·x&nbsp;&nbsp;→&nbsp; Maximum M̄<sub>k</sub> = 1·L = 2,5 (kNm je kN)
      </div>
      <div class="formula-box">
        <b>Schritt 3 — Arbeitsintegral über Koppeltafel</b><br>
        Beide Momentenlinien sind Dreiecke mit Spitze an der Einspannung →<br>
        ∫M·M̄ dx = (1/3)·L·M<sub>i</sub>·M̄<sub>k</sub><br>
        δ = (1/3)·L·M<sub>i</sub>·M̄<sub>k</sub> / (E·I)
      </div>
      <div class="formula-box">
        <b>Schritt 4 — Zahlenwert</b><br>
        IPE 200: I<sub>y</sub> = 1943 cm⁴, E = 21000 kN/cm²<br>
        δ = F·L³/(3·E·I) = 10·250³/(3·21000·1943)<br>
        δ = <b>12,76 mm</b>
        <div class="comment">Längen in cm, Kraft in kN gerechnet</div>
      </div>
      <div class="info-banner">
        <b>Ergebnis:</b> Die Enddurchbiegung beträgt 12,76 mm. Die Koppeltafel
        liefert exakt dasselbe wie die bekannte Formel F·L³/(3EI) — das ist die
        Stärke des PvK: Auch wenn keine fertige Formel existiert (z. B. bei
        zusammengesetzten Lasten oder unbestimmten Systemen), kommt man über
        M·M̄-Integration immer zum Ziel.
      </div>
    </div>
  `,
};

// ── Init ───────────────────────────────────────────
render();

// ── Swipe gesture: swipe right → go back one level ──
(function setupSwipe(){
  let startX = 0, startY = 0, startT = 0, tracking = false;
  let lastTrigger = 0;     // timestamp of the last triggered swipe
  const COOLDOWN = 500;    // ignore further triggers for 500 ms

  document.addEventListener('touchstart', (e) => {
    if(e.touches.length !== 1){ tracking = false; return; }
    const t = e.touches[0];
    // Edge-swipe: only track gestures that start near the left screen edge
    if(t.clientX > 40){ tracking = false; return; }
    startX = t.clientX;
    startY = t.clientY;
    startT = Date.now();
    tracking = true;
  }, { passive: true });

  document.addEventListener('touchend', (e) => {
    if(!tracking) return;
    tracking = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;
    const dt = Date.now() - startT;
    const now = Date.now();

    // Conditions for a "back" swipe:
    // - mostly horizontal (|dx| clearly > |dy|)
    // - rightward (dx > 0), long enough (> 70px), fast enough (< 600ms)
    // - cooldown elapsed since the last trigger
    if(dx > 70 && Math.abs(dx) > Math.abs(dy) * 2 && dt < 600 && (now - lastTrigger) > COOLDOWN){
      lastTrigger = now;
      goBack();
    }
  }, { passive: true });
})();
</script>
</body>
</html>
